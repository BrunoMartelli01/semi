_BASE_: "../../Base_det.yaml"

MODEL:
  META_ARCHITECTURE: "TransformerPureDetectorV2"
  # Usa il pretrain su TotalText o IC17-MLT convertito a 96-voc.
  # Se parti da un checkpoint 37-voc, riaddestra il recognizer head prima di
  # usare questo config (VOC_SIZE diverso rende il rec head incompatibile).
  WEIGHTS: "output/R50/150k_tt/pretrain/model_ts_final.pth"
  TRANSFORMER:
    VOC_SIZE: 96          # 95 caratteri ASCII stampabili + 1 blank token
    LOSS:
      USE_DYNAMIC_K: False
      # Con solo 0.5% labeled, O2M_MATCH_NUM alto (15) aiuta a trovare
      # più match positivi e stabilizza il training nelle prime iterazioni.
      O2M_MATCH_NUM: 15
      LEVEN_ALPHA: 20
      COST_ALPHA: 20
      ADP_POINT_COORD_WEIGHT: 1.0
      ADP_POINT_TEXT_WEIGHT: 0.5
      ADP_BOUNDARY_WEIGHT: 0.5
      DET_ADAPTIVE_TYPE: 'edit_distance'

INPUT:
  ROTATE: False
  MIN_SIZE_TRAIN: (640, 672, 704, 736, 768, 800)
  MAX_SIZE_TRAIN: 1333
  MIN_SIZE_TRAIN_SAMPLING: "choice"
  MIN_SIZE_TEST: 1000
  MAX_SIZE_TEST: 1200
  CROP:
    ENABLED: False

DATASETS:
  # I nomi corrispondono ESATTAMENTE alle entries 96-voc in builtin.py
  TRAIN: ("hiertext_train_0.5_label", "hiertext_train_0.5_unlabel")
  TEST:  ("hiertext_test",)

SOLVER:
  IMS_PER_BATCH: 2          # 2 immagini per GPU (1 labeled + 1 unlabeled per SOURCE_RATIO)
  SOURCE_RATIO: (1, 1)       # 1 labeled : 1 unlabeled per batch (pochi labeled disponibili)
  BASE_LR: 5e-5
  LR_BACKBONE: 5e-6
  WARMUP_ITERS: 0
  STEPS: (10000,)            # lr decay a 10k iter
  MAX_ITER: 15000
  CHECKPOINT_PERIOD: 1000
  FIND_UNUSED_PARAMETERS: True
  AMP:
    ENABLED: True

SSL:
  MODE: "mean-teacher"
  SEMI_WRAPPER: "SemiETSTextSpotter"

  # Con 0.5% labeled il teacher si aggiorna lentamente:
  # - soglia iniziale bassa (0.35) per produrre più pseudo-label nelle prime fasi
  # - soglia finale moderata (0.65) per non essere troppo rumorosa
  PSEUDO_LABEL_INITIAL_SCORE_THR: 0.35
  PSEUDO_LABEL_FINAL_SCORE_THR: 0.65

  USE_SPOTTING_NMS: True
  USE_SEPERATE_MATCHER: False
  USE_COMBINED_THR: False
  O2M_TEXT_O2O: False
  USE_O2M_ENC: False
  MIN_PSEDO_BOX_SIZE: 0

  UNSUP_WEIGHT: 2.0
  CONSISTENCY_WEIGHT: 1.0

  AUG_QUERY: False
  INFERENCE_ON: "teacher"
  STEP_HOOK: True

  # Warm-up più lungo (1500 iter) perché con pochissimi labeled
  # lo student ha bisogno di più iterazioni per stabilizzarsi prima di
  # iniziare a usare pseudo-label.
  WARM_UP: 1500

  # STAGE_WARM_UP: transizione dalla soglia iniziale a quella finale.
  # Con 0.5% labeled, il teacher impiega più a diventare stabile.
  STAGE_WARM_UP: 6000

  EXTRA_STUDENT_INFO: True
  USE_CONSISTENCY: False

  EMA:
    WARM_UP: 0

  DECODER_LOSS: ["labels", "texts_psa", "ctrl_points", "bd_points"]
  O2O_DECODER_LOSS: ["labels", "texts_adaptive_sci", "ctrl_points_adaptive_crc", "bd_points_adaptive_crc"]

TEST:
  EVAL_PERIOD: 1000

OUTPUT_DIR: "output/R50/hiertext/Finetune/semi_0.5s/SemiETS_0.5s"
