_BASE_: "../../Base_det.yaml"

MODEL:
  META_ARCHITECTURE: "TransformerPureDetectorV2"
  WEIGHTS: "output/R50/150k/pretrain/model_ts_96_final.pth"

  TRANSFORMER:
    NUM_QUERIES: 100 #64
    VOC_SIZE: 96          # 95 caratteri ASCII stampabili + 1 blank token
    NUM_POINTS: 50
    LOSS:
      BEZIER_SAMPLE_POINTS: 50
      BEZIER_CLASS_WEIGHT: 1.0
      BEZIER_COORD_WEIGHT: 0.5
      POINT_CLASS_WEIGHT: 1.0
      POINT_COORD_WEIGHT: 0.5
      POINT_TEXT_WEIGHT: 1.0 #0.5
      BOUNDARY_WEIGHT: 0.25
      #########################
      USE_DYNAMIC_K: False
      O2M_MATCH_NUM: 3
      LEVEN_ALPHA: 20 #det
      DET_ADAPTIVE_TYPE: 'edit_distance'


INPUT:
  ROTATE: False
  MIN_SIZE_TEST: 800
  MAX_SIZE_TEST: 1000
  MIN_SIZE_TRAIN: (480, 576, 672, 768, 864)   # era 14 scale tra 480 e 896
  MAX_SIZE_TRAIN: 1400                          # era 1600
  CROP:
    ENABLED: True
    CROP_INSTANCE: False

DATASETS:
  # I nomi corrispondono ESATTAMENTE alle entries 96-voc in builtin.py
  TRAIN: ("hiertext_train_0.5_label", "hiertext_train_0.5_unlabel")
  TEST:  ("hiertext_test",)

SOLVER:
  IMS_PER_BATCH: 2          # 2 immagini per GPU (1 labeled + 1 unlabeled per SOURCE_RATIO)
  SOURCE_RATIO: (1, 1)       # 1 labeled : 1 unlabeled per batch (pochi labeled disponibili)
  BASE_LR: 5e-5
  LR_BACKBONE: 5e-6
  WARMUP_ITERS: 0
  STEPS: (8000,)            # lr decay a 10k iter
  MAX_ITER: 12000
  CHECKPOINT_PERIOD: 1000
  FIND_UNUSED_PARAMETERS: True

SSL:
  MODE: "mean-teacher"
  SEMI_WRAPPER: "SemiETSTextSpotter"
  PSEUDO_LABEL_INITIAL_SCORE_THR: 0.55
  PSEUDO_LABEL_FINAL_SCORE_THR: 0.7
  USE_SPOTTING_NMS: True
  USE_SEPERATE_MATCHER: False
  USE_COMBINED_THR: False
  O2M_TEXT_O2O: False
  USE_O2M_ENC : False
  MIN_PSEDO_BOX_SIZE: 0
  UNSUP_WEIGHT: 2.0
  CONSISTENCY_WEIGHT: 1.0
  AUG_QUERY: False
  INFERENCE_ON: "teacher"
  STEP_HOOK: True
  WARM_UP: 1000  #debug
  STAGE_WARM_UP: 4000
  EXTRA_STUDENT_INFO: True
  USE_CONSISTENCY: False
  EMA:
    WARM_UP: 0
  DECODER_LOSS : ["labels", "texts_psa", "ctrl_points", "bd_points"]
  O2O_DECODER_LOSS : ["labels", "texts_adaptive_sci", "ctrl_points_adaptive_crc", "bd_points_adaptive_crc"]

TEST:
  EVAL_PERIOD: 1000

OUTPUT_DIR: "output/R50/hiertext/Finetune/semi_0.5s/SemiETS_0.5s"
